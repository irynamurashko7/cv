# your designation
designation: Senior Technical Writer | Documentation Engineer

# a summary of what you do
summary: |
  Technical Writer with 5+ years of experience creating and maintaining developer-facing documentation for B2B software products, focusing on API documentation, integration guides, and information architecture.
  Experienced in owning documentation workflows, planning improvements, and collaborating with distributed development teams.

  My experience includes documenting APIs and SDK integrations, creating tutorials, how-to guides, troubleshooting procedures, technical references, and architecture diagrams.
  I take a hands-on approach to documentation, researching product functionality, testing APIs, working with code examples, and validating technical accuracy with developers.
  I work with Git-based Docs-as-Code workflows using Markdown, AsciiDoc, and Antora, as well as collaborative documentation platforms such as Confluence.

  My background in customer support and project management also gives me a strong user-oriented perspective and experience translating technical information into clear, practical instructions.
  
  I also have a background in translation and philology, with professional experience working across English, German, Ukrainian, and Russian. This has strengthened my attention to terminology, consistency, and clear communication.
  
  After a period of freelance work, I'm returning to full-time technical writing and looking for a role where I can contribute to developer-facing and product documentation.

