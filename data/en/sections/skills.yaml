# section information
section:
  name: Skills
  id: skills
  enable: true
  weight: 2
  showOnNavbar: true
  filter: true
  columns: 3
  defaultFilter: "methodology"

# filter buttons
buttons:
  - name: Methodology
    filter: "methodology"
  - name: Docs-as-code Toolchain
    filter: "docs"
  - name: Diagramming
    filter: "diagram"
  - name: Collaboration & Workflow
    filter: "collab"
  - name: Dev Basics
    filter: "dev"
  - name: Languages
    filter: "language"

# Your Skills.
