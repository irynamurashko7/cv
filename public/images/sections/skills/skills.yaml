    categories: ["dev"]

  - name: HTML (basic)
    logo: /images/sections/skills/html.svg
    summary: "Basic HTML for formatting and structuring documentation content."
    categories: ["dev"]

  - name: CSS (basic)
    logo: /images/sections/skills/css.svg
    summary: "Basic CSS for adjusting documentation site styling when needed."
    categories: ["dev"]

  - name: English
    logo: /images/sections/skills/lang-en.svg
    summary: "Advanced (C1) — primary working language for technical writing."
    categories: ["language"]

  - name: German
    logo: /images/sections/skills/lang-de.svg
    summary: "Upper-Intermediate (B2)."
    categories: ["language"]

  - name: Ukrainian
    logo: /images/sections/skills/lang-uk.svg
    summary: "Native / Bilingual."
    categories: ["language"]
