# your designation
designation: Senior Technical Writer | Documentation Engineer

# a summary of what you do
summary: |
  Technical Writer with 5+ years of experience creating and maintaining technical documentation for B2B software products, including restructuring documentation architecture and mentoring a technical writer.
  Experienced in working closely with developers and subject-matter experts to gather, clarify, validate, and structure complex technical information.

  My experience includes product and functionality documentation, API specifications, user guides, tutorials, how-to instructions, troubleshooting procedures, flow diagrams, and technical glossaries.
  I work with Git-based documentation workflows, Markdown, Docs-as-Code, Confluence, GitBook, and Antora.

  My background in customer support and project management also gives me a strong user-oriented perspective and experience translating technical information into clear, practical instructions.
  
  I also have a background in translation and philology, with professional experience working across English, German, Ukrainian, and Russian. This has strengthened my attention to terminology, consistency, and clear communication.
  
  After a period spent running an independent craft business, I'm returning to technical writing and looking for a role where I can contribute to developer-facing and product documentation for software products.

