    responsibilities:
    - Created and maintained developer-facing documentation for B2B software products.
    - Managed documentation planning and priorities for two core development teams, assigned tasks, coordinated work, and reviewed deliverables to ensure quality and consistency.
    - Independently researched product functionality, conducted structured SME interviews, and developed technical documentation, coordinating developer reviews through Git-based pull requests before publication.
    - Reviewed and edited documentation prepared by a junior technical writer, improving clarity, accuracy, consistency, and adherence to writing standards.
    - Documented APIs, product functionality, glossaries, workflows, tutorials, how-to guides, and troubleshooting procedures, translating complex technical concepts into clear, structured, task-oriented documentation.
