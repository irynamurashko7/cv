# section information
section:
  name: Skills
  id: skills
  enable: true
  weight: 2
  showOnNavbar: true
  filter: true

# filter buttons
buttons:
  - name: All
    filter: "all"
  - name: Documentation
    filter: "docs"
  - name: Tools
    filter: "tools"
  - name: Dev Basics
    filter: "dev"
  - name: Languages
    filter: "language"

# Your Skills.
skills:
  - name: Technical Writing
    logo: /images/sections/skills/technical-writing.svg
    summary: "Creating clear, structured, task-oriented documentation for developers and end users, from concept to publication."
    categories: ["docs"]

  - name: API Documentation
    logo: /images/sections/skills/api.svg
    summary: "Documenting REST APIs, testing endpoints, and validating request/response behavior to ensure accuracy."
    categories: ["docs"]

  - name: Information Architecture
    logo: /images/sections/skills/architecture.svg
    summary: "Structuring documentation sets for discoverability, consistent terminology, and long-term maintainability."
    categories: ["docs"]

  - name: Diataxis
    logo: /images/sections/skills/diataxis.svg
    summary: "Applying the Diataxis framework (Tutorials, How-to Guides, Reference, Explanation) to organize documentation."
    categories: ["docs"]

  - name: Docs-as-code
    logo: /images/sections/skills/docs-as-code.svg
    summary: "Writing and maintaining documentation in Git-based workflows alongside developers, using version control and review processes."
    categories: ["docs"]

  - name: Flow Diagrams
    logo: /images/sections/skills/flow-diagram.svg
    summary: "Creating visual diagrams to explain processes, product functionality, and user workflows."
    categories: ["docs"]

  - name: BPMN
    logo: /images/sections/skills/bpmn.svg
    summary: "Modeling business processes and workflows using BPMN notation."
    categories: ["docs"]

  - name: UML
    logo: /images/sections/skills/uml.svg
    summary: "Using UML diagrams to represent system structure and interactions in technical documentation."
    categories: ["docs"]

  - name: JSDoc
    logo: /images/sections/skills/jsdoc.svg
    summary: "Generating and maintaining API reference documentation from JavaScript source comments."
    categories: ["tools"]

  - name: TypeDoc
    logo: /images/sections/skills/typedoc.svg
    summary: "Generating API documentation from TypeScript source code."
    categories: ["tools"]

  - name: Swagger
    logo: /images/sections/skills/swagger.svg
    summary: "Documenting and testing REST APIs using the OpenAPI/Swagger specification."
    categories: ["tools"]

  - name: RapiDoc
    logo: /images/sections/skills/rapidoc.svg
    summary: "Publishing interactive API reference documentation from OpenAPI definitions."
    categories: ["tools"]

  - name: GitBook
    logo: /images/sections/skills/gitbook.svg
    summary: "Building and maintaining documentation sites with GitBook."
    categories: ["tools"]

  - name: Antora
    logo: /images/sections/skills/antora.svg
    summary: "Building multi-version, multi-repository documentation sites with Antora."
    categories: ["tools"]

  - name: Asciidoctor
    logo: /images/sections/skills/asciidoctor.svg
    summary: "Writing structured technical documentation using AsciiDoc syntax."
    categories: ["tools"]

  - name: Confluence
    logo: /images/sections/skills/confluence.svg
    summary: "Maintaining internal team documentation and knowledge bases in Confluence."
    categories: ["tools"]

  - name: Git
    logo: /images/sections/skills/git.svg
    summary: "Working in Git-based documentation and code workflows, including branching and review."
    categories: ["tools"]

  - name: Markdown
    logo: /images/sections/skills/markdown.svg
    summary: "Writing structured content in Markdown for docs-as-code workflows."
    categories: ["tools"]

  - name: JSON
    logo: /images/sections/skills/json.svg
    summary: "Reading and working with JSON data structures for API documentation and testing."
    categories: ["tools"]

  - name: CLI
    logo: /images/sections/skills/cli.svg
    summary: "Comfortable working with command-line tools for documentation builds and testing."
    categories: ["tools"]

  - name: SDLC
    logo: /images/sections/skills/sdlc.svg
    summary: "Familiar with the software development lifecycle and how documentation fits into release processes."
    categories: ["tools"]

  - name: React (basic)
    logo: /images/sections/skills/react.svg
    summary: "Reading and reproducing basic React components (e.g., widgets) to verify documentation accuracy."
