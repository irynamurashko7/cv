baseURL = 'https://irynamurashko7.github.io/cv/'
locale = 'en-us'
title = 'CV'
[module]
  [[module.imports]]
    path = "github.com/hugo-toha/toha/v4"
[params]
    background = "images/background-deepnavy.png"
    logo.favicon = "images/favicon.png"

[params.newsletter]
    enable = false

[params.features]
  darkMode.enable = true

[params.topNavbar]
    maxVisibleSections = 6

[params.footer.navigation]
    enable = false